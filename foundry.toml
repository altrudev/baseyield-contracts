[profile.default]
src     = "src"
out     = "out"
libs    = ["lib"]
test    = "test"
script  = "script"

# Solidity version — matches BaseYieldManager.sol pragma
solc_version = "0.8.20"

# Optimiser — enabled for production gas efficiency
optimizer         = true
optimizer_runs    = 200

# EVM version — Base uses Cancun (Shanghai-compatible)
evm_version = "cancun"

# Remappings — added after forge install
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/",
]

# Formatter
[profile.default.fmt]
line_length      = 100
tab_width        = 4
bracket_spacing  = true

# Test configuration
[profile.default.fuzz]
runs    = 1000
seed    = "0xdeadbeef"

[profile.default.invariant]
runs    = 256
depth   = 15

# ── Network RPC configuration ──────────────────────────────────────────────────
# Set actual values in .env — never commit real keys

[rpc_endpoints]
base_mainnet = "${BASE_MAINNET_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"

[etherscan]
base_mainnet = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
